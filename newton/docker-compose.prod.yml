# newton/docker-compose.prod.yml
#
# Production compose for the newton monorepo (API + frontend on one host).
# Differences from the upstream docker-compose.yml:
#   - server/worker run the newton-hardened image (isolate v2.7)
#   - server port is NOT published: Caddy fronts /api/* and proxies to it
#   - per-process/thread limits enabled (no --cg: cgroup v2 delegation
#     is unavailable inside the container, RLIMITs are used instead)

x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: 100M

services:
  server:
    image: newton/judge0:latest
    build:
      context: ./newton
      dockerfile: Dockerfile.newton
    volumes:
      - ../judge0.conf:/judge0.conf:ro
    privileged: true
    <<: *default-logging
    restart: always

  worker:
    image: newton/judge0:latest
    build:
      context: ./newton
      dockerfile: Dockerfile.newton
    command: ["./scripts/workers"]
    volumes:
      - ../judge0.conf:/judge0.conf:ro
    privileged: true
    <<: *default-logging
    restart: always

  db:
    image: postgres:16.2
    env_file: ../judge0.conf
    volumes:
      - data:/var/lib/postgresql/data/
    <<: *default-logging
    restart: always

  redis:
    image: redis:7.2.4
    command: [
      "bash", "-c",
      'docker-entrypoint.sh --appendonly no --requirepass "$$REDIS_PASSWORD"'
    ]
    env_file: ../judge0.conf
    <<: *default-logging
    restart: always

volumes:
  data: